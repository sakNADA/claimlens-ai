services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CLAIMLENS_DB_PATH: /data/claimlens.db
      CLAIMLENS_CORS_ORIGINS: http://localhost:5173
    volumes:
      - claimlens-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  claimlens-data:

